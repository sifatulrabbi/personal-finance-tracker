name: personal-finance-app-dev-deps

services:
  postgres:
    image: postgres:17-alpine
    container_name: personal-finance-app-dev-postgres
    restart: unless-stopped
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: finance_tracker
      POSTGRES_PASSWORD: finance_tracker
      POSTGRES_DB: finance_tracker_dev
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U finance_tracker -d finance_tracker_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres_dev_data:
